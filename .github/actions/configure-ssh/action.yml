name: Configure SSH
description: Sets up ssh access to iacdipl-7 through the fog.ethz.ch proxy.

inputs:
  fog-key:
    description: Private key for ti16102 on fog.ethz.ch
    required: true
  iacdipl7-key:
    description: Private key for l_c2sm on iacdipl-7.ethz.ch
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        ID_FOG: ${{ inputs.fog-key }}
        ID_TARGET: ${{ inputs.iacdipl7-key }}
      run: |
        umask 077
        mkdir -p ~/.ssh
        echo "${ID_FOG}" > ~/.ssh/id_ed25519_fog
        echo "${ID_TARGET}" > ~/.ssh/id_ed25519_iacdipl7

        cat > ~/.ssh/config << 'EOF'
        Host fog
          Hostname fog.ethz.ch
          User ti16102
          IdentityFile ~/.ssh/id_ed25519_fog
          IdentitiesOnly yes
        Host iacdipl7
          Hostname iacdipl-7.ethz.ch
          User l_c2sm
          IdentityFile ~/.ssh/id_ed25519_iacdipl7
          IdentitiesOnly yes
          ProxyJump fog
        EOF

        cat > ~/.ssh/known_hosts << 'EOF'
        fog.ethz.ch ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMMGddQwl0gXqcPeL4FFjiyXBrfPXdfDOdX5f+gM+o1F
        iacdipl-7.ethz.ch ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIZgUr0MuFxJRvEqG/iEZs1QYoG2VvjCPLoRnfW3Ljbv
        EOF
