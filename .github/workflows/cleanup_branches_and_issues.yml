name: Cleanup branches and issues
on:
  schedule:
    - cron: '0 0 * * *'  # Run this workflow every day at midnight
  workflow_dispatch:

env:
  DAYS: 7
jobs:
  deleteOldBranches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch all branches
        run: git fetch --all

      - name: Delete old branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/delete_old_branches.sh

  closeOldIssues:
    runs-on: ubuntu-latest
    steps:
      - name: Close old data request issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const max_age = Number(process.env.DAYS) * 24 * 60 * 60 * 1000;
            const now = new Date();
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'data request',
                state: 'open',
                per_page: 100,
              }
            );
            for (const issue of issues) {
              // Skip pull requests
              if (issue.pull_request) continue;
              const created_at = new Date(issue.created_at);
              if (now - created_at > max_age) {
                core.info(`Closing #${issue.number}: ${issue.title}`);
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
            }
