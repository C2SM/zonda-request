name: Cleanup HTTPS server

# Daily housekeeping on iacdipl-7:
# - deletes published request output older than 7 days
# - removes request run directories under /ssd older than 7 days, debug runs
#   after 30 days. A detached run that dies without its EXIT trap leaves its
#   workspace behind, so this also catches orphaned workspaces.
# - prunes stopped containers, dangling images and build cache in podman
#
# A manual run with dry_run only lists what would be deleted.

on:
  # Offset from close_old_data_request_issues.yml's midnight run.
  schedule:
    - cron: '30 0 * * *'
      timezone: 'Europe/Zurich'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be deleted'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cleanup-https-server

env:
  DATA_PATH: /net/co2/c2sm-services/zonda-request
  RUNS_ROOT: /ssd/c2sm-services/zonda-request-runs
  DRY_RUN: ${{ inputs.dry_run == true }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          fog-key: ${{ secrets.FOG_SSH_KEY }}
          iacdipl7-key: ${{ secrets.IACDIPL7_SSH_KEY }}

      # The script travels over stdin, so nothing needs to be uploaded.
      - name: Delete old output from the HTTPS server
        run: |
          ssh iacdipl7 python3 - --path "$DATA_PATH" --threshold 7 \
            ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }} < scripts/cleanup_data_server.py

      # The testsuite cleans its own run directories in testsuite.yml.
      - name: Delete old run directories
        run: |
          ssh iacdipl7 bash -s -- "$RUNS_ROOT" "$DRY_RUN" << 'REMOTE'
          action=(-exec rm -rf {} +)
          [ "$2" = true ] && action=()
          find "$1" -mindepth 2 -maxdepth 2 -type d -path "$1/request-*/run-*" \
            \( \( -name '*-debug' -mtime +30 \) -o \( ! -name '*-debug' -mtime +7 \) \) -print "${action[@]}"
          [ "$2" = true ] || find "$1" -mindepth 1 -maxdepth 1 -type d -name 'request-*' -empty -print -delete
          REMOTE

      # Covers what 'podman container prune' and 'podman image prune' remove.
      - name: Prune podman
        if: env.DRY_RUN != 'true'
        run: ssh iacdipl7 podman system prune -f
