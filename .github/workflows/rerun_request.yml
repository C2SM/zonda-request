name: Rerun request

# Commenting "rerun request" on an open, not currently processing issue resets
# its status and re-invokes process_request.yml, which re-reads the issue body.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  actions: write

jobs:
  rerun:
    if: |
      startsWith(github.event.comment.body, 'rerun request') &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      !contains(github.event.issue.labels.*.name, 'submitted')
    runs-on: ubuntu-latest
    steps:
      - name: Reset status label and retrigger processing
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number

            for (const label of ['completed', 'failed', 'aborted', 'invalid']) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name: label
                })
              } catch (error) {
                if (error.status !== 404) throw error
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ['submitted']
            })

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'process_request.yml',
              ref: context.payload.repository.default_branch,
              inputs: { issue_number: String(issue_number) }
            })
