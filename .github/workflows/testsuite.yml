name: Testsuite

# Processes the fixture requests in the issues labeled 'testsuite' with the
# code under review, synchronously, as a regular pass/fail check. Nothing is
# archived, published, commented or relabeled (run_pipeline.sh --testsuite).
# The fixture issues only hold the request JSON, which is fetched live.
#
# Triggered by the 'run testsuite' label on a pull request, or manually via
# workflow_dispatch. Remove and re-add the label to run it again.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

# Each label has its own group, so labeling a running PR with anything else does not cancel it.
concurrency:
  group: testsuite-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || 'dispatch' }}
  cancel-in-progress: true

env:
  RUNS_ROOT: /ssd/c2sm-services/zonda-request-runs/testsuite

jobs:
  testsuite:
    # Pull requests from forks have no access to the ssh secrets.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run testsuite' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        issue_number: [1697, 1698, 1699, 1700, 1701, 1702]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          fog-key: ${{ secrets.FOG_SSH_KEY }}
          iacdipl7-key: ${{ secrets.IACDIPL7_SSH_KEY }}

      # The run directory holds the workspace and the pipeline log and is kept
      # after the run. Run directories older than 30 days are removed here.
      - name: Create remote workspace
        id: create_remote_workspace
        run: |
          run_dir="$RUNS_ROOT/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.issue_number }}"
          ssh iacdipl7 "mkdir -p '$run_dir/workspace' && find '$RUNS_ROOT' -mindepth 1 -maxdepth 1 -type d -mtime +30 -exec rm -rf {} +"
          echo "run_dir=$run_dir" >> "$GITHUB_OUTPUT"
          echo "::notice title=Run directory::$run_dir, log $run_dir/pipeline.log"

      - name: Upload repository to iacdipl-7
        run: rsync -avh --exclude='.git' ./ "iacdipl7:${{ steps.create_remote_workspace.outputs.run_dir }}/workspace/"

      # The pty makes a cancelled job send SIGHUP to run_pipeline.sh, which then stops the pipeline.
      # The matrix value is part of RUN_ID so the parallel jobs get distinct hashes.
      - name: Run testsuite request on iacdipl-7
        env:
          RUN_DIR: ${{ steps.create_remote_workspace.outputs.run_dir }}
          ISSUE_ID: ${{ matrix.issue_number }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.issue_number }}
        run: |
          ssh -tt iacdipl7 "bash -o pipefail -c 'cd $RUN_DIR/workspace && ISSUE_ID=$ISSUE_ID RUN_ID=$RUN_ID bash scripts/run_pipeline.sh --testsuite --debug 2>&1 | tee ../pipeline.log'"
