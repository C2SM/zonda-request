name: Testsuite

# Processes the fixture requests in the issues labeled 'testsuite' with the
# code under review, synchronously, as a regular pass/fail check. Nothing is
# archived, published, commented or relabeled (run_pipeline.sh --testsuite).
# The fixture issues only hold the request JSON, which is fetched live.
#
# Uses the same fog -> iacdipl-7 proxy and secrets as process_request.yml.
# Pull requests from forks have no access to these secrets and will fail.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testsuite:
    strategy:
      fail-fast: false
      matrix:
        issue_number: [1697, 1698, 1699, 1700, 1701, 1702]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure ssh
        env:
          ID_FOG: ${{ secrets.FOG_SSH_KEY }}
          ID_TARGET: ${{ secrets.IACDIPL7_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${ID_FOG}" > ~/.ssh/id_ed25519_fog
          echo "${ID_TARGET}" > ~/.ssh/id_ed25519_iacdipl7

          cat > ~/.ssh/config << 'EOF'
          Host fog
            Hostname fog.ethz.ch
            User ti16102
            IdentityFile ~/.ssh/id_ed25519_fog
            IdentitiesOnly yes
          Host iacdipl7
            Hostname iacdipl-7.ethz.ch
            User l_c2sm
            IdentityFile ~/.ssh/id_ed25519_iacdipl7
            IdentitiesOnly yes
            ProxyJump fog
          EOF

          cat > ~/.ssh/known_hosts << 'EOF'
          fog.ethz.ch ssh-rsa AAAAB3NzaC1yc2EAAAABIwAAAIEA1LZFUYJ7qouXhKEf6YpH+QtJlX0cr8Jf390Gkam8ydfy0C35sOZYaHQCxwDo5ghBy6rRlUyJDPRDDy4VZEL25FXsR3U1k6/kKRoGbkhY4lS9i+kNfaveBj1S4Ih8Ykw4q3bauck7dTBrrAu6VGwKtdpU6Lkxh3Wizjilt0wciB8=
          fog.ethz.ch ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBI3rw1g+UMRDdjem5htVjJHSPvSmvHKQ9bHiqPzDi9jtkX2dqyKEt8sM2SXhLwcDeawfVODH2okO+Cc28MS7fFo=
          fog.ethz.ch ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMMGddQwl0gXqcPeL4FFjiyXBrfPXdfDOdX5f+gM+o1F
          iacdipl-7.ethz.ch ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIZgUr0MuFxJRvEqG/iEZs1QYoG2VvjCPLoRnfW3Ljbv
          iacdipl-7.ethz.ch ssh-rsa 
          iacdipl-7.ethz.ch ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBALrIi4NyEffUk2qoJq7tizx6dGqa2YZM007ilq0fOAufd7zpY7RuvVOMNF6Zd93CuOcnfegeRyqMIOG6CV7dYc=
          EOF

          chmod 600 ~/.ssh/config ~/.ssh/known_hosts ~/.ssh/id_ed25519_fog ~/.ssh/id_ed25519_iacdipl7

      - name: Create remote workspace
        id: workdir
        run: |
          remote_dir=$(ssh iacdipl7 'mkdir -p /ssd/c2sm-services/zonda-request-runs && mktemp -d /ssd/c2sm-services/zonda-request-runs/testsuite-XXXXXXXX')
          echo "path=$remote_dir" >> "$GITHUB_OUTPUT"

      - name: Upload repository to iacdipl-7
        run: rsync -avh --exclude='.git' ./ "iacdipl7:${{ steps.workdir.outputs.path }}/"

      # The matrix value is part of RUN_ID so the parallel jobs get distinct hashes.
      - name: Run testsuite request on iacdipl-7
        run: |
          ssh iacdipl7 bash -s << REMOTE
          export ISSUE_ID='${{ matrix.issue_number }}'
          export RUN_ID='${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.issue_number }}'
          cd '${{ steps.workdir.outputs.path }}'
          bash scripts/run_pipeline.sh --testsuite
          REMOTE

      # The EXIT trap normally removes the workspace already.
      - name: Remove remote workspace
        if: always() && steps.workdir.outputs.path != ''
        run: ssh iacdipl7 "rm -rf '${{ steps.workdir.outputs.path }}'"
